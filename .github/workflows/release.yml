# Release: push a tag `vX.Y.Z` and this builds deck for Linux and macOS
# (amd64 + arm64), stamps the tag into `deck --version`, and publishes a
# GitHub release with one tarball per target plus checksums.txt.
# install.sh downloads exactly these asset names, so keep them stable.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  checks: read
  actions: read
  # R236: the attest step below mints an OIDC token and stores the attestation.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 brings every branch, so refs/remotes/origin/main exists
      # with full history for the gate's `git merge-base --is-ancestor`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # R214: the tagged sha must also be an ancestor of origin/main, so a
      # tag pushed on a side branch or an unmerged commit never publishes.
      # R147: never build or publish a release for a commit whose CI
      # suite (ci.yml's "suite" check) did not go green on a push or a
      # pull request. Runs before anything else in this job -- see
      # ci/releasegate/main.go for what "green" means (among the suite
      # runs whose own workflow event is push or pull_request, the most
      # recently started one completed with conclusion success -- a
      # nightly `schedule` or manual `workflow_dispatch` run is never
      # consulted, whatever its own conclusion) and what refusal looks
      # like (non-zero exit, a message naming this sha and what it
      # found: no push/PR run at all, still in progress, a non-success
      # conclusion, or only a non-gating schedule/workflow_dispatch run).
      # actions: read (permissions above) is needed to resolve each check
      # run's check_suite to the workflow run event that produced it.
      - name: Gate on green CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./ci/releasegate -repo "$GITHUB_REPOSITORY" -sha "$GITHUB_SHA"

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${os}_${arch}/deck" ./cmd/deck
            tar -C "dist/${os}_${arch}" -czf "dist/deck_${os}_${arch}.tar.gz" deck
            rm -r "dist/${os}_${arch}"
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt)

      - name: Smoke
        run: |
          set -eu
          tar -xzf dist/deck_linux_amd64.tar.gz -C dist
          dist/deck --version | tee /dev/stderr | grep -qx "deck ${GITHUB_REF_NAME} linux/amd64"
          rm dist/deck

      # R236: build-provenance attestation over the release tarballs and
      # checksums.txt. install.sh checks it with `gh attestation verify`.
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Publish
        # Throwaway CI-verification tags (v0.0.0-ci-verify-*, per the run's
        # own standing rules) exercise this workflow end-to-end without
        # ever cutting a real GitHub release.
        if: ${{ !startsWith(github.ref_name, 'v0.0.0-ci-verify-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
