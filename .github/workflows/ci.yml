name: ci

# R145: the suite on trusted PRs, push to main, the nightly lane and manual
# dispatch. See docs/ci.md (task C.12) for the maintainer-facing walkthrough
# and prds/phase4d-backlog-sweep-and-ci.md's "Tier 3 -- CI" section for the
# full design (GH #35).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # nightly: 03:17 UTC, an arbitrary off-hour slot so it doesn't collide
    # with GitHub's own top-of-hour cron thundering herd.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # R165 (GH #50): the group folds in github.event_name, and then a
  # per-event tiebreaker chosen so that no two runs of the same non-PR
  # event can ever land in the same group: github.sha for `push` (every
  # push already carries a distinct commit), github.ref for
  # `pull_request` (so a same-PR successor still shares its PR's group,
  # which is what lets cancel-in-progress cancel a superseded PR run
  # below), and github.run_id -- unique to every single workflow run,
  # see GitHub's own docs, "Contexts", https://docs.github.com/en/actions/
  # learn-github-actions/contexts -- for everything else (`schedule` and
  # `workflow_dispatch`).
  #
  # Before this, push/schedule/workflow_dispatch all evaluated to the
  # same `ci-ci-refs/heads/main` group (every one of those events' own
  # `github.ref` is the default branch), so a push to main queued
  # strictly behind whatever nightly/dispatch run happened to be in
  # flight. A first fix folded in only github.event_name (plus
  # github.sha for push), which separated push from schedule/dispatch but
  # left every `schedule` run sharing ONE group with every other
  # `schedule` run, and every `workflow_dispatch` run sharing ONE group
  # with every other `workflow_dispatch` run (both still keyed on the
  # same constant `github.ref`) -- GitHub keeps only one PENDING run per
  # group and cancels the older pending run when a newer one queues, so
  # two schedule runs (or two dispatches on the very same sha) queued
  # back to back would still cancel each other's pending run, which is
  # exactly the R165 defect this workflow exists to remove. Keying the
  # non-push, non-PR branch on github.run_id instead removes that: every
  # schedule/dispatch run's own group is now unique to that run, so it
  # can never be the older pending run cancelled by a later one -- it
  # runs to completion (or fails outright) every time, same as a push.
  # See GitHub's own docs, "Control the concurrency of workflows and
  # jobs" (https://docs.github.com/en/actions/using-jobs/using-concurrency):
  # the group expression is what decides queue/cancel/run-side-by-side,
  # not the event type by itself.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || (github.event_name == 'pull_request' && github.ref || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every self-hosted job below repeats this same job-level `if:` (job-level
# `if:` cannot read the workflow's own top-level `env:`, so it is inlined on
# each job rather than centralised): a pull_request run's head repo must be
# this repository itself. For every other event type github.event.pull_request
# is null, so the equality would be false and the guard would wrongly refuse
# push/schedule/workflow_dispatch runs -- hence the
# `github.event_name != 'pull_request' ||` short-circuit. The `pull_request`
# trigger checks out and evaluates workflow YAML from the PR's own head, so
# this guard is what keeps a fork's code off the self-hosted runners; the
# base-ref-YAML/head-ref-checkout trigger that would defeat that guard is
# deliberately never used here.

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, linux, x64, deck]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build/refresh the CI image
        run: docker build -t deck-ci:local -f ci/Dockerfile ci

      - name: Lint (gofmt -l, go vet, go mod tidy diff) -- fails fast, before the suite
        run: ci/run.sh ci/lint.sh

  suite:
    name: suite
    needs: lint
    runs-on: [self-hosted, linux, x64, deck]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 180 || 30 }}
    env:
      # Relative, not github.workspace-absolute: ci/run.sh's sibling mounts
      # this same checkout at /w and runs with that as its WORKDIR, so a
      # relative path resolves to the identical directory whether the shell
      # invoking `ci/run.sh` runs on the host (this step) or inside the
      # sibling container (ci/suite.sh itself) -- an absolute host path
      # would not exist inside the container's own root filesystem.
      DECK_CI_OUT: ci-results
      # What ci/suite.sh writes into the Allure results' environment.properties
      # and executor.json (R195). ci/run.sh forwards only DECK_* variables into
      # its container, so the sha and the run link ride in under these names.
      DECK_CI_SHA: ${{ github.sha }}
      DECK_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # nightly-only race detector, per R145; ci/suite.sh switches its
      # -covermode to atomic automatically whenever this mentions -race.
      DECK_CI_GO_EXTRA_FLAGS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-race' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build/refresh the CI image
        run: docker build -t deck-ci:local -f ci/Dockerfile ci

      - name: Run the suite (lint already gated this job on success)
        id: suite
        continue-on-error: true
        run: ci/run.sh ci/suite.sh

      - name: Quality gates (ci/quality.sh; every gate off until a later task flips one on, R187)
        id: quality
        continue-on-error: true
        run: ci/run.sh ci/quality.sh "$DECK_CI_OUT"

      - name: Nightly stability (3 clean-state runs, R145)
        id: stability
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        # NOT wrapped in ci/run.sh: ci/stability.sh itself launches one fresh
        # `ci/run.sh go test -p=1 -count=1 ./...` sibling per run (that is
        # what makes each run clean-state), so it must run here on the
        # runner host where docker is available -- inside the deck-ci image
        # there is no docker and every run would fail with "image
        # deck-ci:local not found". Its mktemp dir (per-run logs and
        # summary.log) is placed under the results dir so the upload step
        # below carries it.
        run: |
          set -eu
          mkdir -p "$DECK_CI_OUT/stability"
          TMPDIR="$PWD/$DECK_CI_OUT/stability" ci/stability.sh 3

      - name: Job summary (pass/fail/flaky counts, slowest packages)
        if: always()
        run: |
          set -eu
          if [ -d "$DECK_CI_OUT" ]; then
            ci/summary.sh "$DECK_CI_OUT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### CI suite summary" >> "$GITHUB_STEP_SUMMARY"
            echo "(no results directory -- the suite step never produced output)" >> "$GITHUB_STEP_SUMMARY"
          fi
          for s in "$DECK_CI_OUT"/stability/*/summary.log; do
            [ -f "$s" ] || continue
            {
              echo
              echo "#### nightly stability (ci/stability.sh 3)"
              echo
              grep -E '^=== RUN [0-9]+: (PASS|FAIL)' "$s" | sed 's/^/- /' || true
              echo "- $(tail -n 1 "$s")"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-${{ github.run_id }}
          path: ${{ env.DECK_CI_OUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job if the suite, quality gates, or the nightly stability run failed
        if: steps.suite.outcome == 'failure' || steps.quality.outcome == 'failure' || steps.stability.outcome == 'failure'
        run: exit 1

  # R146: build the Allure report from the JUnit results `suite` produced,
  # carry history forward from the previously published report, and merge
  # the result into a persisted `gh-pages` branch tree that accumulates
  # every still-live report (the site root, plus every open PR's own
  # `/pr/<n>/` subtree). `actions/deploy-pages` always replaces the *whole*
  # Pages site with whatever artifact it is handed, so the only way for a
  # main-triggered deploy to not erase a live PR preview (or vice versa) is
  # for every deploy's own artifact to already contain the full tree; this
  # job is what assembles that tree. It never holds `pages: write` or
  # `id-token: write` -- only `publish` below does -- so it cannot deploy
  # anything itself; it only stages the merged tree as a Pages artifact for
  # `publish` to hand to `actions/deploy-pages`, and separately pushes that
  # same tree to `gh-pages` as durable storage across runs (a plain data
  # branch this workflow reads back next time; never the Pages *source*,
  # which stays "GitHub Actions"/build_type=workflow throughout -- nothing
  # here ever touches the repository's Pages settings).
  report:
    name: report (Allure)
    needs: [lint, suite]
    runs-on: [self-hosted, linux, x64, deck]
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && needs.suite.result != 'skipped'
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      # The pinned version ci/allure-report.sh fetches when `allure` is not
      # already on PATH; bumped only here, the same convention as
      # ci/suite.sh's own GOTESTSUM_VERSION.
      ALLURE_VERSION: "2.34.1"
    outputs:
      link: ${{ steps.target.outputs.link }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download this run's raw results
        uses: actions/download-artifact@v4
        with:
          name: ci-results-${{ github.run_id }}
          path: ci-results

      - name: Where this run publishes
        id: target
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            n=${{ github.event.pull_request.number }}
            echo "mode=pr" >> "$GITHUB_OUTPUT"
            echo "pr_number=$n" >> "$GITHUB_OUTPUT"
            echo "link=https://n-orlov.github.io/deck/pr/$n/" >> "$GITHUB_OUTPUT"
          else
            echo "mode=root" >> "$GITHUB_OUTPUT"
            echo "link=https://n-orlov.github.io/deck/" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java (Allure's own runtime; ci/Dockerfile stays untouched)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch the persisted site tree (gh-pages), or start an empty one
        id: site
        # A second checkout of this same repo, at `main` (a ref that always
        # exists), purely so this step inherits actions/checkout's own
        # persisted-credentials setup (an extraheader in this checkout's own
        # local .git/config) instead of a token spelled out anywhere in this
        # workflow. Once that is in place, plain git commands against
        # `origin` from inside `site/` are already authenticated, whether
        # `gh-pages` exists yet (checked out for real) or not (a fresh
        # orphan branch, the first-run case).
        run: |
          set -eu
          git init -q site
          git -C site remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Give the site checkout the same credentials as this run's own checkout
        run: |
          set -eu
          header=$(git config --get http.https://github.com/.extraheader || true)
          if [ -n "$header" ]; then
            git -C site config --local "http.https://github.com/.extraheader" "$header"
          fi

      - name: Check out gh-pages, or start it as an orphan
        run: |
          set -eu
          cd site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --quiet --depth 1 origin gh-pages
            git checkout -q -B gh-pages origin/gh-pages
          else
            echo "no gh-pages branch yet -- starting an empty site" >&2
            git checkout -q --orphan gh-pages
          fi

      # R196: the formatter's own fixture (features/allure_formatter_fixture_test.go)
      # run through the pinned Allure's `allure generate`, and the generated
      # report checked for the fixture's steps and its @gh-61 link, before the
      # real report is built and published. Steps of this job, not a job of
      # their own; the fixture needs Go, so it runs in the CI image like the
      # suite does.
      - name: Build/refresh the CI image (for the Allure smoke fixture)
        run: docker build -t deck-ci:local -f ci/Dockerfile ci

      - name: Allure smoke -- write the formatter fixture results
        run: |
          set -eu
          rm -rf allure-smoke
          mkdir -p allure-smoke/fixture/allure-results
          # go test runs in features/, so the path is /w-absolute (ci/run.sh
          # mounts this checkout at /w), not relative to the checkout.
          DECK_ALLURE_FIXTURE_OUT=/w/allure-smoke/fixture/allure-results \
            ci/run.sh go test -count=1 -run '^TestAllureFormatterWritesResultsForAFixtureRun$' ./features/

      - name: Allure smoke -- allure generate over the fixture, check steps and the @gh-NN link
        run: ci/allure-smoke.sh allure-smoke/fixture allure-smoke/report

      - name: Generate the Allure report (history carried over on a root publish, if any)
        run: |
          set -eu
          history_dir=""
          if [ "${{ steps.target.outputs.mode }}" = "root" ] && [ -d site/history ]; then
            history_dir=site/history
          fi
          ci/allure-report.sh ci-results allure-report "$history_dir"

      - name: Merge this run's report into the persisted site tree and push it to gh-pages
        # R165: delegates to ci/pages-persist.sh (see its own header comment)
        # instead of a single unretried `git push` -- a concurrent report
        # from another run (a push to main racing its own PR preview, or
        # two PRs) can land on gh-pages first and reject this push as a
        # non-fast-forward; the script re-fetches, re-merges this run's own
        # report on top of the newer tree, and retries a bounded number of
        # times rather than failing the job outright on the first race lost.
        env:
          DECK_PAGES_RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          if [ "${{ steps.target.outputs.mode }}" = "root" ]; then
            ci/pages-persist.sh site allure-report root
          else
            ci/pages-persist.sh site allure-report pr "${{ steps.target.outputs.pr_number }}"
          fi

      - name: Upload the rendered report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the merged site tree as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Job summary (Allure report link, coverage totals)
        if: always()
        run: |
          set -eu
          ci/summary.sh ci-results "${{ steps.target.outputs.link }}" >> "$GITHUB_STEP_SUMMARY"

  # R146: the only job with `pages: write`/`id-token: write` in this
  # workflow -- `report` above assembles the artifact but never deploys it.
  # Runs on a GitHub-hosted runner: deploying is one API call through
  # `actions/deploy-pages`, needs neither the deck slots nor docker, and
  # keeps those two shared self-hosted slots free for the next queued run.
  #
  # Gated to root-triggered events only (push to main, schedule,
  # workflow_dispatch), never `pull_request`: the repo's own `github-pages`
  # deployment environment already carries a branch policy allowing only
  # `main` (a pre-existing repository setting this job is never allowed to
  # change -- see the standing rule and the PRD's "repository settings
  # changes by the job, of any kind" non-goal), so a PR-branch deploy
  # attempt is rejected by GitHub server-side before any step runs, whether
  # or not this job even declares `environment:` in its own YAML (Pages
  # deployments are always attributed to that one environment). A PR's own
  # /pr/<n>/ report is instead published by `pages-pr-publish.yml`
  # (R146, GH #35 §5), a separate `workflow_run`-triggered workflow that
  # fires the moment *this* workflow's own run completes and deploys the
  # already-merged `gh-pages` tree `report` pushed below -- `workflow_run`
  # always executes on the default branch regardless of what triggered the
  # run it reacts to, so it satisfies the same "main only" branch policy
  # for free, without this job or that one ever touching the policy
  # itself. See that file for the rest of the design.
  publish:
    name: publish (Pages)
    needs: report
    if: >-
      always()
      && needs.report.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: >-
        ${{ steps.deployment4.outputs.page_url ||
        steps.deployment3.outputs.page_url ||
        steps.deployment2.outputs.page_url ||
        steps.deployment1.outputs.page_url }}
    steps:
      # R166 (GH #50): actions/deploy-pages hits GitHub's Pages API, which
      # occasionally 5xxs or times out transiently; retry up to three times
      # with back-off before letting the job go red. Every attempt but the
      # last carries `continue-on-error: true` so a failed attempt's own
      # `outcome` (unlike `conclusion`, never overridden by
      # continue-on-error) is still readable by the next attempt's `if:`;
      # the final attempt omits it, so a persistent failure still fails
      # this job. `environment.url` above falls back through whichever
      # attempt actually produced a `page_url` output.
      #
      # R165 (GH #50): bumped from three attempts/45s of total back-off to
      # four/210s, and this is also what covers GitHub's "a deployment is
      # already in progress" refusal specifically, not just a generic
      # 5xx/timeout. The workflow-level `concurrency:` group above now lets
      # a push, the nightly schedule and a manual dispatch run side by
      # side (each its own group), and this job's own sibling in
      # pages-pr-publish.yml (a *different* workflow, so this workflow's
      # concurrency group never serializes against it at all) can also be
      # deploying the same `github-pages` environment at the same moment
      # -- so two `publish` runs racing a real deploy-pages call is an
      # expected occasional case now, not a rare fluke. GitHub's own REST
      # docs for the Pages API (https://docs.github.com/en/rest/pages/pages)
      # state builds/deployments are "limited to one concurrent build per
      # repository" and a second request while one is in progress is
      # queued/rejected rather than accepted; actions/deploy-pages' own
      # source (https://github.com/actions/deploy-pages, action.yml's
      # `timeout` input, default 600000ms/10 minutes) bounds how long a
      # single deployment may stay "in progress" before GitHub itself gives
      # up on it -- chasing that full worst case here would consume this
      # job's own 10-minute timeout, so the back-off below is deliberately
      # bounded well under it while still being long enough that a
      # same-second collision with another run's own deploy (which in
      # practice settles in well under a minute for a static Pages site)
      # clears before this job gives up.
      - name: Deploy to GitHub Pages (attempt 1 of 4)
        id: deployment1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Back off before retry 2
        if: steps.deployment1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2 of 4)
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Back off before retry 3
        if: steps.deployment2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 3 of 4)
        id: deployment3
        if: steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Back off before retry 4
        if: steps.deployment3.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (attempt 4 of 4)
        id: deployment4
        if: steps.deployment3.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # R146: exactly one PR comment carrying the report link, created or
  # updated depending on whether a comment with the marker HTML string
  # already exists -- never appended as a fresh comment on every run. Keyed
  # only on `report` (not `publish`, which never even runs for a PR event --
  # see the note on `publish` above): the PR's /pr/<n>/ content is already
  # merged into the persisted site tree by the time `report` succeeds, and
  # goes live once `pages-pr-publish.yml`'s own deploy (triggered by this
  # run's completion) finishes -- shortly after this comment posts, not at
  # some later, unrelated root-triggered deploy.
  pr-comment:
    name: PR comment (Allure link)
    needs: report
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # R146 (review finding B2): the previous inline actions/github-script
      # step called the octokit issue-comments "list" method with no
      # pagination arguments, which only ever returns page one (default
      # per_page=30) -- once a PR held more ordinary comments than that, or
      # the marker comment itself ended up beyond whatever page one held,
      # every run appended a fresh marker comment instead of updating the
      # existing one in place. ci/prcomment pages through every comment
      # (per_page=100, following the Link: rel="next" header, the same
      # pattern ci/releasegate already uses for check-runs/actions-runs)
      # before deciding to create or update. See ci/prcomment/main.go.
      - name: Create or update the PR's Allure link comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          go run ./ci/prcomment \
            -repo "${{ github.repository }}" \
            -pr "${{ github.event.pull_request.number }}" \
            -sha "${{ github.event.pull_request.head.sha }}" \
            -link "${{ needs.report.outputs.link }}"

  # R145: a red main/nightly run POSTs exactly one message with the run URL.
  # This is its own job, not a step inside `suite`, because `suite` has
  # `needs: lint`: when lint fails fast, `suite` is skipped outright and a
  # notify step living inside it would never run. `always()` makes this job
  # evaluate after both upstream jobs whatever their outcome (failure,
  # cancellation/timeout, or `suite` skipped behind a red lint), and the
  # needs.*.result checks keep it silent on a green run. It is the only
  # place in the workflow that POSTs, so one red run sends one message.
  notify:
    name: notify (red main/nightly)
    needs: [lint, suite]
    runs-on: [self-hosted, linux, x64, deck]
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 5
    steps:
      - name: POST the red run's URL to the notifier
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SUITE_RESULT: ${{ needs.suite.result }}
        run: |
          set -eu
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg="deck CI red: ${{ github.event_name }} on ${{ github.ref_name }} (lint=${LINT_RESULT}, suite=${SUITE_RESULT}) -- ${run_url}"
          payload=$(python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "$msg")
          curl -fsS -X POST "http://100.71.162.65:8090/notify" \
            -H "Content-Type: application/json" \
            --data "$payload"
