name = "cobalt"
appearance = "dark"            # "dark" | "light" — drives contrast direction

[colors]
background        = "#0a2a6e"  # panel interiors
surface           = "#0f3270"  # elevated rows, footer, dialog interiors
border            = "#3a64a8"
border_focus      = "#5ce1ff"  # the focused panel (§11.3)
selection         = "#1b4a9a"  # selected row, focused panel
selection_idle    = "#123c80"  # selected row, unfocused panel
title             = "#b8f0ff"
text              = "#e8f2ff"
dimmed            = "#9bb4de"  # starting rows, elided detail
hint              = "#b3c8ea"  # footer descriptions
key               = "#7fe0ff"  # footer/help keycaps
accent            = "#4cc9f0"
group             = "#e8f2ff"  # workspace headers
search_match      = "#ffffff"
badge             = "#b3c8ea"  # live/sampled, env↻
badge_warn        = "#ffb020"  # non-safe permission profiles, yolo
waiting           = "#d8f8ff"  # the seven §7 statuses, one token each
running           = "#2ecc71"
idle              = "#9bb4de"
starting          = "#8aa4ff"
stopped           = "#a8b8d0"
error             = "#ff4545"
archived          = "#8fa6c8"
